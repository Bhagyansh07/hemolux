name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A superseded run on the same ref cancels the one in flight. On a force-push
# during review this matters: the check that matters is the one against the
# commit being reviewed, not the one that started first.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: lint and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    # Python 3.13 is the only interpreter this pipeline is verified against.
    # pyproject declares >=3.11 and the package is written to 3.11 syntax, but
    # claiming 3.11 and 3.12 here would be an untested claim, and an untested
    # matrix entry in CI is worse than no matrix entry.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      # Keep BLAS single-threaded. The suite is dominated by small-array work,
      # and thread-pool oversubscription on a shared runner costs more than the
      # parallelism gains.
      OMP_NUM_THREADS: "2"
      PYTHONHASHSEED: "0"
      # Leave decoder diagnostics alone. hemolux.imagemeta filters one known-bad
      # libpng line by default, because on the author's machine 639 corrupt mask
      # ICC profiles bury the output. A CI runner has no such corpus, and a real
      # decode failure should be visible rather than filtered, so the filter is
      # switched off here rather than trusted.
      HEMOLUX_STRICT_IMAGE_LOG: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # PyTorch must come from the CPU index. The default wheel bundles CUDA and
      # adds several gigabytes to every run for code paths this project never
      # executes. Installing it first also stops pip from backtracking over the
      # exact pins in pyproject.toml.
      #
      # One line, no backslash continuation. This job also runs on
      # windows-latest, where the shell is PowerShell, and a trailing backslash
      # is not a line continuation there -- pip received the two arguments
      # 'torch==2.14.1' and '\\', and failed with "Directory '\\' is not
      # installable". The failure was only ever visible on the Windows leg.
      - name: Install PyTorch from the CPU index
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1

      - name: Install the package
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Confirm formatting is not machine-specific
        run: ruff format --check .

      # The real corpus is not in the repository and cannot be, so this runs
      # against the synthetic fixture written by
      # scripts/make_synthetic_fixture.py. Tests that genuinely need the real
      # data are marked slow and skip.
      - name: Build the synthetic fixture
        run: python scripts/make_synthetic_fixture.py

      - name: Test
        run: pytest

  package:
    name: build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install PyTorch from the CPU index
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.14.1 torchvision==0.29.1
      - name: Install build tooling
        run: python -m pip install build
      - name: Build the wheel and sdist
        run: python -m build
      # The distribution must not contain the dataset, the weights, or the
      # internal planning set. This asserts it rather than trusting the ignore
      # rules, because those have already been wrong twice.
      - name: Check the distribution contents
        run: |
          python - <<'PY'
          import sys, tarfile, zipfile, glob

          forbidden = ("brain/", "data/raw/", "artifacts/", ".venv/")
          problems = []
          for path in glob.glob("dist/*.whl"):
              with zipfile.ZipFile(path) as zf:
                  names = zf.namelist()
                  problems += [f"{path}: {n}" for n in names
                               if any(n.startswith(p) for p in forbidden)]
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as tf:
                  names = tf.getnames()
                  problems += [f"{path}: {n}" for n in names
                               if any(f"/{p}" in n for p in forbidden)]
          if problems:
              print("distribution contains excluded paths:")
              for p in problems[:40]:
                  print("  ", p)
              sys.exit(1)
          print("distribution is clean")
          PY