# pyproject.toml's exact pins and the pinned workflow actions.
#
# Minor and patch updates arrive as one grouped pull request per
# ecosystem, capped at three open PRs each. This is the one repository
# where a bump is not free: the pins in pyproject.toml are
# load-bearing, and a silent version change is a silent change to the
# numbers EVALS.md reports. A grouped PR here is a read-the-diff and
# re-run-the-suite task, never a merge on sight. The `onnx` and
# `onnxruntime` pins are the sharp edge of that rule: they change what
# the exported graph computes, so a bump to either belongs with a
# re-run of the frozen evaluation.
#
# Major updates are ignored outright. Auto-merge is deliberately absent.
version: 2
updates:
- package-ecosystem: "pip"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 3
  groups:
    minor-and-patch:
      patterns: ["*"]
      update-types: ["minor", "patch"]
  ignore:
    # A major is a migration with its own test pass, so it is taken on
    # deliberately rather than offered weekly. Delete this rule when you
    # want to be told about majors again.
    - dependency-name: "*"
      update-types: ["version-update:semver-major"]
